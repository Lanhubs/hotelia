services:
  # Main API Server (serves API + frontend + admin)
  - type: web
    name: keo-hotel-api
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: VITE_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: NODE_ENV
        value: production

  # PostgreSQL Database
  - type: pserv
    name: keo-hotel-db
    runtime: postgresql
    plan: starter
    region: oregon
    ipAllowList: []
    databaseName: keo_hotel
    databaseUser: keo_admin
